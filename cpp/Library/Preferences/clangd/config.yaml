If:
  PathMatch: /Users/user/programs/cf-probs/.*
CompileFlags:
  Add:
    - -std=gnu++20
    - -I/Users/user/programs/cf-probs
    - -DLOCAL
    - -isystem
    - /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/c++/v1
Diagnostics:
  UnusedIncludes: None
  ClangTidy:
    Remove:
      - "*"
